# Cấu hình dùng cho CẢ local (`npm run dev`) LẪN deploy production qua Cloudflare
# Worker thật: nexrall-netviet-sales-os1
# Mọi ID dưới đây thuộc account Trungductwice@gmail.com (30714345f6e1dcdd6326cfe203ee379e)
# — đúng account mà Workers Builds đang deploy. ID của account khác sẽ báo "not found".

name = "nexrall-netviet-sales-os1"
main = "local/entry.js"
compatibility_date = "2026-09-01"

# Front-end tĩnh (index.html + src/ + styles/) được build vào ./public
# Request không khớp file tĩnh sẽ rơi vào Worker (/api/*)
[assets]
directory = "./public"
not_found_handling = "single-page-application"


# D1 Database
# Local:
#   wrangler dev --local
# Production:
#   wrangler deploy
[[d1_databases]]
binding = "DB"
database_name = "netviet-sales-os"
database_id = "d66cff24-9f74-4112-9ff7-0dddfc40061f"


# Cloudflare KV
[[kv_namespaces]]
binding = "SHARED_KV"
id = "4259d86abe2d4379be3a6b035c02462e"


# Cloudflare R2
# Lưu file gốc: báo giá / hợp đồng / tài liệu Sales Kit
[[r2_buckets]]
binding = "DOCS"
bucket_name = "netviet-sales-os-docs"


# Cron Trigger
# M10 Automation: mỗi 30 phút gọi /api/__cron
[triggers]
crons = [
  "*/30 * * * *"
]
